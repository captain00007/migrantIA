services:
  db:
    image: pgvector/pgvector:pg16
    container_name: migrantia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: migrantia
      POSTGRES_USER: migrantia_user
      POSTGRES_PASSWORD: migrantia_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrantia_user -d migrantia"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrantia_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-migrantia
      - DATABASE_URL=postgres://migrantia_user:migrantia_password@db:5432/migrantia
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
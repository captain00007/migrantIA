{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}MigrantIA — Assistente Inteligente para Migrantes e Refugiados{% endblock %}</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Assistente oficial e multilíngue para apoio jurídico, regularização e direitos de migrantes e refugiados no Brasil.">
  <meta name="theme-color" content="#1e3a8a">
  
  <!-- Mobile & PWA Compatibility -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MigrantIA">
  
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Scripts -->
  <script src="{% static 'js/i18n.js' %}"></script>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/speech.js' %}"></script>
  <script src="{% static 'js/app.js' %}?v=2"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{% static 'sw.js' %}?v=2")
          .then((reg) => console.log("[PWA] Service Worker registrado:", reg.scope))
          .catch((err) => console.warn("[PWA] Erro no Service Worker:", err));
      });
    }
  </script>
</body>
</html>
